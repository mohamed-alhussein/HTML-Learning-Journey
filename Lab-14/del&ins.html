<!DOCTYPE html>

<body>
    <b>Basic Usage of the del Tag</b>
    <p>This example uses both del and ins tags to show a price update , clearly indicating what been removed and what has been added .</p>
    <p>The product was orignally priced at <del>30$</del> <ins>25$</ins> . </p>
    <b>Combining del with ins Tags </b>
    <p>He found his <del>Keys</del> <ins>Wallet</ins> under the sofa .</p>
</body>
</html>
